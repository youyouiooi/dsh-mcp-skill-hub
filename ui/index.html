<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 与技能管理</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fb; --panel: rgba(255,255,255,.86); --card: #ffffff;
    --text: #182032; --muted: #68738a; --line: rgba(24,32,50,.09);
    --accent: #5b5ce2; --accent2: #8b5cf6; --accent-soft: rgba(91,92,226,.1);
    --green: #12935f; --green-soft: rgba(18,147,95,.12);
    --red: #d94b52; --red-soft: rgba(217,75,82,.1);
    --amber: #b7791f; --amber-soft: rgba(183,121,31,.14);
    --shadow: 0 10px 30px rgba(30,40,80,.07), 0 2px 6px rgba(30,40,80,.04);
    --shadow-hover: 0 16px 40px rgba(30,40,80,.13), 0 4px 10px rgba(30,40,80,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10121a; --panel: rgba(24,27,38,.88); --card: #1a1e2b;
      --text: #e8ebf4; --muted: #98a1b7; --line: rgba(255,255,255,.09);
      --accent: #8b8df9; --accent2: #a78bfa; --accent-soft: rgba(139,141,249,.14);
      --green: #4ade9c; --green-soft: rgba(74,222,156,.13);
      --red: #ff858c; --red-soft: rgba(255,133,140,.12);
      --amber: #f0b75a; --amber-soft: rgba(240,183,90,.14);
      --shadow: 0 12px 32px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
      --shadow-hover: 0 18px 44px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 13.5px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(700px 340px at 8% -10%, rgba(91,92,226,.14), transparent 65%),
      radial-gradient(600px 320px at 100% 0%, rgba(139,92,246,.12), transparent 60%);
  }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  .shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 26px 24px 40px; }

  /* header */
  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .logo {
    width: 46px; height: 46px; flex: 0 0 auto; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    box-shadow: 0 8px 22px rgba(91,92,226,.35);
  }
  .hero h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  .hero p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .hero .spacer { flex: 1; }
  .stat { text-align: right; color: var(--muted); font-size: 12px; }
  .stat b { display: block; font-size: 20px; color: var(--text); line-height: 1.2; }

  /* nav */
  .nav {
    display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  .nav button {
    display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px;
    background: transparent; color: var(--muted); padding: 7px 18px; font-weight: 500; transition: all .15s;
  }
  .nav button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 12px rgba(91,92,226,.3); }
  .nav button:not(.active):hover { color: var(--text); background: var(--accent-soft); }

  .page { display: none; }
  .page.active { display: block; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* controls */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .field {
    display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 11px; height: 36px;
  }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input, .field select { border: 0; outline: 0; background: transparent; height: 100%; min-width: 0; }
  .field.grow { flex: 1; min-width: 180px; }
  .field.grow input { width: 100%; }
  .field svg { color: var(--muted); flex: 0 0 auto; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 15px;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; font-weight: 500; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 5px 14px rgba(91,92,226,.3); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.small { height: 29px; padding: 0 11px; font-size: 12px; border-radius: 8px; }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .spacer { flex: 1; }

  /* MCP cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; box-shadow: var(--shadow); transition: box-shadow .18s, transform .18s;
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-head { display: flex; align-items: flex-start; gap: 11px; }
  .conn-icon {
    width: 38px; height: 38px; flex: 0 0 auto; border-radius: 11px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; text-transform: uppercase;
  }
  .card-title { font-size: 15px; font-weight: 650; word-break: break-all; }
  .card-sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  .endpoint {
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted);
    background: var(--accent-soft); border-radius: 8px; padding: 6px 9px; word-break: break-all;
  }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 550;
    padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.gray { background: var(--line); color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .error-box {
    font-size: 12px; color: var(--red); background: var(--red-soft);
    border-radius: 8px; padding: 7px 10px; word-break: break-word;
  }
  .card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; padding-top: 4px; }

  /* skills */
  .skill-layout {
    display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start;
  }
  @media (max-width: 800px) { .skill-layout { grid-template-columns: 1fr; } }
  .skill-list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 240px); overflow-y: auto; padding: 2px; }
  .skill-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    padding: 12px 14px; cursor: pointer; transition: all .15s;
  }
  .skill-item:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .skill-item.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
  .skill-item .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .skill-item .desc { color: var(--muted); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .detail-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); min-width: 0; }
  .detail-card h2 { margin: 0 0 8px; font-size: 19px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 12.5px; word-break: break-all; margin: 7px 0; }
  .meta b { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 9px; margin: 15px 0; flex-wrap: wrap; }
  pre.content {
    white-space: pre-wrap; word-break: break-word; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 15px; font-size: 12px;
    font-family: ui-monospace, Consolas, monospace; max-height: 46vh; overflow: auto; margin: 0;
  }
  .cwd-row { margin-bottom: 14px; }
  .cwd-row .field { width: 100%; }
  .empty { padding: 46px 20px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 30px; margin-bottom: 8px; opacity: .6; }

  /* dialog & toast */
  dialog {
    border: 1px solid var(--line); border-radius: 18px; padding: 24px;
    background: var(--card); color: var(--text); width: min(600px, 92vw);
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(12,16,30,.45); backdrop-filter: blur(3px); }
  dialog h3 { margin: 0 0 4px; font-size: 17px; }
  dialog .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  dialog label { display: block; margin: 12px 0 5px; font-weight: 600; font-size: 12.5px; }
  dialog input, dialog select, dialog textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 11px; outline: none;
  }
  dialog input:focus, dialog textarea:focus, dialog select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  dialog textarea { min-height: 190px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: all .2s; z-index: 30; max-width: 82%;
    box-shadow: 0 12px 30px rgba(0,0,0,.25); font-size: 13px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M6 2V4.5M10 2V4.5" stroke-linecap="round"/>
        <path d="M3.5 4.5H12.5V8.25C12.5 10.7353 10.4853 12.75 8 12.75C5.51472 12.75 3.5 10.7353 3.5 8.25V4.5Z" stroke-linejoin="round"/>
        <path d="M8 12.75V14.5" stroke-linecap="round"/>
        <path d="M6.4 7.2L7.6 8.4L9.9 5.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1 id="hero-title"></h1>
      <p id="hero-sub"></p>
    </div>
    <div class="spacer"></div>
    <div class="stat"><b id="stat-connections">–</b><span id="stat-connections-label"></span></div>
    <div class="stat" style="margin-left:22px"><b id="stat-skills">–</b><span id="stat-skills-label"></span></div>
  </header>

  <nav class="nav">
    <button id="tab-mcp" class="active">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2V4.5M10 2V4.5M3.5 4.5H12.5V8.25C12.5 10.7 10.5 12.75 8 12.75C5.5 12.75 3.5 10.7 3.5 8.25V4.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="tab-mcp-label"></span>
    </button>
    <button id="tab-skills">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2.5H11L13 4.5V13.5H3Z" stroke-linejoin="round"/><path d="M5.5 6.5H10.5M5.5 9H10.5M5.5 11.5H8.5" stroke-linecap="round"/></svg>
      <span id="tab-skills-label"></span>
    </button>
  </nav>

  <section id="page-mcp" class="page active">
    <div class="toolbar">
      <button class="btn primary" id="mcp-add"></button>
      <button class="btn" id="mcp-health"></button>
      <button class="btn" id="mcp-reload"></button>
      <div class="spacer"></div>
      <span class="card-sub" id="mcp-summary"></span>
    </div>
    <div class="cards" id="mcp-list"></div>
  </section>

  <section id="page-skills" class="page">
    <div class="toolbar">
      <div class="field grow">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg>
        <input id="skill-search">
      </div>
      <div class="field"><select id="skill-source"><option value=""></option></select></div>
      <button class="btn" id="skill-refresh"></button>
      <button class="btn primary" id="skill-new"></button>
    </div>
    <div class="cwd-row">
      <div class="field">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4.5C2 3.7 2.7 3 3.5 3H6L7.5 4.5H12.5C13.3 4.5 14 5.2 14 6V11.5C14 12.3 13.3 13 12.5 13H3.5C2.7 13 2 12.3 2 11.5Z" stroke-linejoin="round"/></svg>
        <input id="skill-cwd" spellcheck="false" style="width:100%">
      </div>
    </div>
    <div class="skill-layout">
      <div class="skill-list" id="skill-list"></div>
      <div class="detail-card" id="skill-detail"></div>
    </div>
  </section>
</div>

<dialog id="create-dialog">
  <h3 id="create-title"></h3>
  <form id="create-form">
    <label for="create-name">name</label>
    <input id="create-name" required placeholder="my-skill" pattern="[a-z0-9]+(-[a-z0-9]+)*">
    <label for="create-description">description</label>
    <input id="create-description" required>
    <label for="create-scope" id="create-scope-label"></label>
    <select id="create-scope"><option value="user"></option><option value="project"></option></select>
    <label for="create-content" id="create-content-label"></label>
    <textarea id="create-content"></textarea>
    <div class="actions" style="justify-content:flex-end;margin-bottom:0">
      <button type="button" class="btn" id="create-cancel"></button>
      <button type="submit" class="btn primary" id="create-submit"></button>
    </div>
  </form>
</dialog>

<dialog id="json-dialog">
  <h3 id="json-title"></h3>
  <p class="hint" id="json-hint"></p>
  <textarea id="json-text" spellcheck="false"></textarea>
  <div class="actions" style="justify-content:flex-end;margin-bottom:0">
    <button type="button" class="btn" id="json-cancel"></button>
    <button type="button" class="btn primary" id="json-save"></button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var locale = (params.get('locale') || 'zh-CN').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh-CN';
  var I18N = {
    'zh-CN': {
      title: 'MCP 与技能', subtitle: '在一个面板里管理 MCP 连接与 Skills，无需进入市场。',
      mcp: 'MCP 连接', skills: 'Skills 技能', connections: '连接', skillsCount: '技能',
      add: '添加连接', healthAll: '刷新状态', reload: '刷新',
      noConnections: '暂无 MCP 连接', noConnectionsHint: '点击「添加连接」导入 JSON 配置即可开始使用。',
      mcpMissing: '独立 MCP 后端暂不可用，请重新加载 MCP 与技能管理插件后重试。',
      summary: '共 {n} 条连接 · {on} 条启用',
      enabled: '已启用', disabled: '已停用', disable: '停用', enable: '启用',
      reconnect: '重新连接', health: '状态', edit: '编辑配置', remove: '删除',
      confirmRemove: '确定删除该 MCP 连接吗？',
      stateConnected: '已注册工具', stateDisabled: '已停用', stateError: '异常', stateAuth: '待授权', stateUnknown: '等待连接 / 无工具',
      tools: '工具', addTitle: '添加 MCP 连接', addHint: '粘贴 JSON 配置（支持 {"mcpServers": {...}} 或单条连接格式），保存后自动连接。',
      editTitle: '编辑连接配置', editHint: '直接修改该连接的 JSON 配置，保存后生效。serverName 决定工具名称，不能直接修改。',
      save: '保存', cancel: '取消', saved: '已保存', added: '连接已添加', removed: '连接已删除', refreshed: '已刷新',
      search: '搜索技能名称或描述…', allSources: '全部来源', refresh: '刷新', newSkill: '新建技能',
      cwdPlaceholder: '项目目录（可选，用于加载/创建项目级技能），例如 E:\\AIScripts\\DSH\\skill',
      empty: '选择左侧的技能查看详情', noSkills: '没有匹配的技能',
      reveal: '打开所在目录', del: '删除技能', confirmDelete: '确定删除该技能的文件吗？此操作不可恢复：',
      createTitle: '新建技能', scope: '位置', scopeUser: '用户级（~/.dsh/skills）', scopeProject: '项目级（<项目>/.dsh/skills）',
      content: '内容（SKILL.md 正文，frontmatter 自动生成）', create: '创建',
      created: '技能已创建', deleted: '已删除', failed: '操作失败', loading: '加载中…',
      modelInvocable: '模型可调用', userInvocable: '用户可调用', whenToUse: '何时使用', path: '路径'
    },
    en: {
      title: 'MCP & Skills', subtitle: 'Manage MCP connections and Skills in one panel — no marketplace.',
      mcp: 'MCP connections', skills: 'Skills', connections: 'connections', skillsCount: 'skills',
      add: 'Add connection', healthAll: 'Refresh status', reload: 'Refresh',
      noConnections: 'No MCP connections yet', noConnectionsHint: 'Click "Add connection" and paste a JSON config to get started.',
      mcpMissing: 'The independent MCP backend is unavailable. Reload the MCP & Skill Hub plugin and try again.',
      summary: '{n} connections · {on} enabled',
      enabled: 'Enabled', disabled: 'Disabled', disable: 'Disable', enable: 'Enable',
      reconnect: 'Reconnect', health: 'Check', edit: 'Edit config', remove: 'Remove',
      confirmRemove: 'Remove this MCP connection?',
      stateConnected: 'Connected', stateDisabled: 'Disabled', stateError: 'Error', stateAuth: 'Needs auth', stateUnknown: 'Pending / no tools',
      tools: 'tools', addTitle: 'Add MCP connection', addHint: 'Paste JSON config ({"mcpServers": {...}} or a single connection). It connects automatically after saving.',
      editTitle: 'Edit connection config', editHint: 'Edit the connection JSON directly. serverName is immutable because it determines tool names.',
      save: 'Save', cancel: 'Cancel', saved: 'Saved', added: 'Connection added', removed: 'Connection removed', refreshed: 'Refreshed',
      search: 'Search skills…', allSources: 'All sources', refresh: 'Refresh', newSkill: 'New skill',
      cwdPlaceholder: 'Project directory (optional, for project skills), e.g. E:\\AIScripts\\DSH\\skill',
      empty: 'Select a skill on the left to view details', noSkills: 'No matching skills',
      reveal: 'Reveal in folder', del: 'Delete skill', confirmDelete: 'Delete this skill\'s files? This cannot be undone: ',
      createTitle: 'New skill', scope: 'Location', scopeUser: 'User (~/.dsh/skills)', scopeProject: 'Project (<project>/.dsh/skills)',
      content: 'Content (SKILL.md body; frontmatter is generated)', create: 'Create',
      created: 'Skill created', deleted: 'Deleted', failed: 'Operation failed', loading: 'Loading…',
      modelInvocable: 'Model-invocable', userInvocable: 'User-invocable', whenToUse: 'When to use', path: 'Path'
    }
  };
  var t = I18N[locale];
  document.documentElement.lang = locale;
  document.title = t.title;
  function $(id) { return document.getElementById(id); }
  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(message) {
    var el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  function api(path, options) {
    return fetch('/mcp-skill-hub/' + path, options).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok || data.ok === false) throw new Error(data.error || data.message || ('HTTP ' + res.status));
        return data;
      });
    });
  }
  function post(path, body) {
    return api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  }
  function connector(method, params) {
    return post('api/mcp', { method: method, params: params || {} });
  }

  // ---- header & tabs ----
  $('hero-title').textContent = t.title;
  $('hero-sub').textContent = t.subtitle;
  $('stat-connections-label').textContent = t.connections;
  $('stat-skills-label').textContent = t.skillsCount;
  $('tab-mcp-label').textContent = t.mcp;
  $('tab-skills-label').textContent = t.skills;
  function selectTab(name) {
    ['mcp', 'skills'].forEach(function (key) {
      $('tab-' + key).classList.toggle('active', key === name);
      $('page-' + key).classList.toggle('active', key === name);
    });
  }
  $('tab-mcp').onclick = function () { selectTab('mcp'); };
  $('tab-skills').onclick = function () { selectTab('skills'); };

  // ---- MCP ----
  $('mcp-add').textContent = '+ ' + t.add;
  $('mcp-health').textContent = t.healthAll;
  $('mcp-reload').textContent = t.reload;
  var mcpAvailable = true;
  var mcpItems = [];

  function statePill(item) {
    var state = item.enabled === false ? 'disabled' : (item.connectionState || 'unknown');
    if (state === 'disabled') return '<span class="pill gray"><span class="dot"></span>' + esc(t.stateDisabled) + '</span>';
    if (state === 'authorization-required') return '<span class="pill amber"><span class="dot"></span>' + esc(t.stateAuth) + '</span>';
    if (state === 'connected' || state === 'ok' || state === 'healthy') return '<span class="pill green"><span class="dot"></span>' + esc(t.stateConnected) + '</span>';
    if (state === 'unknown' || state === 'pending') return '<span class="pill gray"><span class="dot"></span>' + esc(t.stateUnknown) + '</span>';
    return '<span class="pill red"><span class="dot"></span>' + esc(t.stateError) + '</span>';
  }

  function renderMcp() {
    $('stat-connections').textContent = mcpItems.length;
    var on = mcpItems.filter(function (i) { return i.enabled !== false; }).length;
    $('mcp-summary').textContent = t.summary.replace('{n}', mcpItems.length).replace('{on}', on);
    var list = $('mcp-list');
    if (!mcpAvailable) {
      list.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔌</div>' + esc(t.mcpMissing) + '</div>';
      return;
    }
    if (!mcpItems.length) {
      list.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔌</div><div style="font-size:15px;color:var(--text);margin-bottom:4px">' + esc(t.noConnections) + '</div>' + esc(t.noConnectionsHint) + '</div>';
      return;
    }
    list.innerHTML = mcpItems.map(function (item, index) {
      var errorText = item.lastError || item.healthMessage;
      return '<div class="card">' +
        '<div class="card-head">' +
          '<div class="conn-icon">' + esc((item.name || item.serverName || 'M').charAt(0)) + '</div>' +
          '<div style="min-width:0"><div class="card-title">' + esc(item.name || item.serverName || item.key) + '</div>' +
          '<div class="card-sub">' + esc(item.serverName || item.connectorId || '') + '</div></div>' +
        '</div>' +
        '<div class="pills">' + statePill(item) +
          '<span class="pill">' + esc(item.transport || item.kind || 'http') + '</span>' +
          (item.injectionMode === 'session' ? '<span class="pill amber">' + esc(item.injectionLabel || 'session') + '</span>' : '') +
        '</div>' +
        (item.endpoint ? '<div class="endpoint">' + esc(item.endpoint) + '</div>' : '') +
        (errorText ? '<div class="error-box">' + esc(errorText) + '</div>' : '') +
        '<div class="card-actions">' +
          '<button class="btn small" data-act="toggle" data-i="' + index + '">' + esc(item.enabled === false ? t.enable : t.disable) + '</button>' +
          '<button class="btn small" data-act="reconnect" data-i="' + index + '">' + esc(t.reconnect) + '</button>' +
          '<button class="btn small" data-act="health" data-i="' + index + '">' + esc(t.health) + '</button>' +
          (item.canEditConfiguration ? '<button class="btn small" data-act="edit" data-i="' + index + '">' + esc(t.edit) + '</button>' : '') +
          '<div class="spacer"></div>' +
          '<button class="btn small danger" data-act="remove" data-i="' + index + '">' + esc(t.remove) + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function loadMcp() {
    return connector('status').then(function (result) {
      mcpAvailable = true;
      mcpItems = (result.detail && result.detail.items) || [];
      renderMcp();
    }).catch(function (err) {
      mcpAvailable = false;
      mcpItems = [];
      renderMcp();
      $('mcp-list').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔌</div>' + esc(t.mcpMissing) + '<div class="meta">' + esc(err.message) + '</div></div>';
    });
  }

  function mcpAction(act, item) {
    if (act === 'toggle') return connector('setEnabled', { key: item.key, enabled: item.enabled === false }).then(loadMcp);
    if (act === 'reconnect') return connector('reconnect', { key: item.key }).then(loadMcp);
    if (act === 'health') return connector('healthCheck', { connectorId: item.connectorId }).then(loadMcp);
    if (act === 'remove') {
      if (!confirm(t.confirmRemove + '\n' + (item.name || item.key))) return Promise.resolve();
      return connector('disconnect', { key: item.key }).then(function () { toast(t.removed); return loadMcp(); });
    }
    if (act === 'edit') {
      return connector('editableConnectionConfig', { key: item.key }).then(function (result) {
        var text = result.json || (result.detail && result.detail.json) || JSON.stringify(result.detail || result, null, 2);
        openJsonDialog(t.editTitle, t.editHint, typeof text === 'string' ? text : JSON.stringify(text, null, 2), t.save, function (value) {
          return connector('reconfigureConnection', { key: item.key, json: value }).then(function () { toast(t.saved); return loadMcp(); });
        });
      });
    }
    return Promise.resolve();
  }

  $('mcp-list').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-act]');
    if (!button) return;
    var item = mcpItems[Number(button.dataset.i)];
    if (!item) return;
    button.disabled = true;
    Promise.resolve(mcpAction(button.dataset.act, item)).catch(function (err) {
      toast(t.failed + ': ' + err.message);
    }).finally(function () { button.disabled = false; });
  });
  $('mcp-reload').onclick = function () { return loadMcp(); };
  $('mcp-health').onclick = function () {
    return connector('healthCheck', {}).then(loadMcp).catch(function (err) { toast(t.failed + ': ' + err.message); });
  };
  $('mcp-add').onclick = function () {
    var example = JSON.stringify({ mcpServers: { 'my-server': { transport: 'streamable-http', url: 'https://example.com/mcp' } } }, null, 2);
    openJsonDialog(t.addTitle, t.addHint, example, t.save, function (value) {
      return connector('importJson', { json: value }).then(function () { toast(t.added); return loadMcp(); });
    });
  };

  var jsonSaveHandler = null;
  function openJsonDialog(title, hint, text, saveLabel, onSave) {
    $('json-title').textContent = title;
    $('json-hint').textContent = hint;
    $('json-text').value = text;
    $('json-save').textContent = saveLabel;
    jsonSaveHandler = onSave;
    $('json-dialog').showModal();
  }
  $('json-cancel').textContent = t.cancel;
  $('json-cancel').onclick = function () { $('json-dialog').close(); };
  $('json-save').onclick = function () {
    if (!jsonSaveHandler) return;
    var value = $('json-text').value;
    try { JSON.parse(value); } catch (e) { toast(t.failed + ': ' + e.message); return; }
    $('json-save').disabled = true;
    Promise.resolve(jsonSaveHandler(value)).then(function () {
      $('json-dialog').close();
    }).catch(function (err) {
      toast(t.failed + ': ' + err.message);
    }).finally(function () { $('json-save').disabled = false; });
  };

  // ---- Skills ----
  $('skill-search').placeholder = t.search;
  $('skill-source').options[0].textContent = t.allSources;
  $('skill-refresh').textContent = t.refresh;
  $('skill-new').textContent = '+ ' + t.newSkill;
  $('skill-cwd').placeholder = t.cwdPlaceholder;
  $('skill-detail').innerHTML = '<div class="empty"><div class="big">✨</div>' + esc(t.empty) + '</div>';
  $('skill-cwd').value = localStorage.getItem('mcp-skill-hub:cwd') || '';
  $('skill-cwd').addEventListener('change', function () {
    localStorage.setItem('mcp-skill-hub:cwd', $('skill-cwd').value.trim());
    loadSkills();
  });

  var skills = [];
  var selectedName = null;
  function cwdQuery() {
    var cwd = $('skill-cwd').value.trim();
    return cwd ? '&cwd=' + encodeURIComponent(cwd) : '';
  }
  function loadSkills() {
    $('skill-list').innerHTML = '<div class="empty">' + esc(t.loading) + '</div>';
    return api('api/skills?x=1' + cwdQuery()).then(function (result) {
      skills = result.skills || [];
      $('stat-skills').textContent = skills.length;
      renderSources();
      renderList();
      if (selectedName && !skills.some(function (s) { return s.name === selectedName; })) {
        selectedName = null;
        $('skill-detail').innerHTML = '<div class="empty"><div class="big">✨</div>' + esc(t.empty) + '</div>';
      }
    }).catch(function (err) {
      $('skill-list').innerHTML = '<div class="empty">' + esc(t.failed + ': ' + err.message) + '</div>';
    });
  }
  function renderSources() {
    var select = $('skill-source');
    var current = select.value;
    while (select.options.length > 1) select.remove(1);
    var sources = {};
    skills.forEach(function (s) { sources[s.source] = true; });
    Object.keys(sources).sort().forEach(function (source) {
      var option = document.createElement('option');
      option.value = source;
      option.textContent = source;
      select.appendChild(option);
    });
    select.value = current;
  }
  function renderList() {
    var query = $('skill-search').value.trim().toLowerCase();
    var source = $('skill-source').value;
    var list = $('skill-list');
    list.innerHTML = '';
    var filtered = skills.filter(function (s) {
      if (source && s.source !== source) return false;
      if (!query) return true;
      return (s.name + ' ' + (s.description || '')).toLowerCase().indexOf(query) !== -1;
    });
    if (!filtered.length) {
      list.innerHTML = '<div class="empty">' + esc(t.noSkills) + '</div>';
      return;
    }
    filtered.forEach(function (s) {
      var item = document.createElement('div');
      item.className = 'skill-item' + (s.name === selectedName ? ' selected' : '');
      item.innerHTML = '<div class="name">' + esc(s.name) + '<span class="pill">' + esc(s.source) + '</span></div>' +
        '<div class="desc">' + esc(s.description) + '</div>';
      item.onclick = function () { selectSkill(s.name); };
      list.appendChild(item);
    });
  }
  function selectSkill(name) {
    selectedName = name;
    renderList();
    $('skill-detail').innerHTML = '<div class="empty">' + esc(t.loading) + '</div>';
    api('api/skills/get?name=' + encodeURIComponent(name) + cwdQuery()).then(function (result) {
      if (selectedName !== name) return;
      renderDetail(result.skill);
    }).catch(function (err) {
      $('skill-detail').innerHTML = '<div class="empty">' + esc(t.failed + ': ' + err.message) + '</div>';
    });
  }
  function renderDetail(skill) {
    var detail = $('skill-detail');
    var invocation = [];
    if (skill.invocation && skill.invocation.modelInvocable) invocation.push(t.modelInvocable);
    if (skill.invocation && skill.invocation.userInvocable) invocation.push(t.userInvocable);
    var canDelete = skill.path && (skill.source === 'user-dsh' || skill.source === 'user-agents' ||
      skill.source === 'project-dsh' || skill.source === 'project-agents' || skill.source === 'custom');
    detail.innerHTML =
      '<h2>' + esc(skill.name) + '</h2>' +
      '<div class="pills">' + invocation.map(function (x) { return '<span class="pill green">' + esc(x) + '</span>'; }).join('') +
        '<span class="pill">' + esc(skill.source) + '</span></div>' +
      '<div class="meta">' + esc(skill.description || '') + '</div>' +
      (skill.whenToUse ? '<div class="meta"><b>' + esc(t.whenToUse) + ':</b> ' + esc(skill.whenToUse) + '</div>' : '') +
      (skill.path ? '<div class="meta"><b>' + esc(t.path) + ':</b> ' + esc(skill.path) + '</div>' : '') +
      '<div class="actions">' +
        (skill.path ? '<button class="btn small" id="detail-reveal">' + esc(t.reveal) + '</button>' : '') +
        (canDelete ? '<button class="btn small danger" id="detail-delete">' + esc(t.del) + '</button>' : '') +
      '</div>' +
      '<pre class="content">' + esc(skill.content || '') + '</pre>';
    if (skill.path) {
      $('detail-reveal').onclick = function () {
        post('api/skills/reveal', { path: skill.path }).catch(function (err) { toast(t.failed + ': ' + err.message); });
      };
    }
    if (canDelete) {
      $('detail-delete').onclick = function () {
        if (!confirm(t.confirmDelete + '\n' + skill.path)) return;
        var body = { path: skill.path };
        var cwd = $('skill-cwd').value.trim();
        if (cwd) body.cwd = cwd;
        post('api/skills/delete', body).then(function () {
          toast(t.deleted);
          selectedName = null;
          $('skill-detail').innerHTML = '<div class="empty"><div class="big">✨</div>' + esc(t.empty) + '</div>';
          loadSkills();
        }).catch(function (err) { toast(t.failed + ': ' + err.message); });
      };
    }
  }
  $('skill-search').addEventListener('input', renderList);
  $('skill-source').addEventListener('change', renderList);
  $('skill-refresh').onclick = loadSkills;

  // ---- create skill dialog ----
  $('create-title').textContent = t.createTitle;
  $('create-scope-label').textContent = t.scope;
  $('create-scope').options[0].textContent = t.scopeUser;
  $('create-scope').options[1].textContent = t.scopeProject;
  $('create-content-label').textContent = t.content;
  $('create-cancel').textContent = t.cancel;
  $('create-submit').textContent = t.create;
  $('skill-new').onclick = function () {
    $('create-name').value = '';
    $('create-description').value = '';
    $('create-content').value = '';
    $('create-dialog').showModal();
  };
  $('create-cancel').onclick = function () { $('create-dialog').close(); };
  $('create-form').addEventListener('submit', function (event) {
    event.preventDefault();
    var body = {
      name: $('create-name').value.trim(),
      description: $('create-description').value.trim(),
      content: $('create-content').value,
      scope: $('create-scope').value,
      cwd: $('skill-cwd').value.trim()
    };
    $('create-submit').disabled = true;
    post('api/skills/create', body).then(function () {
      $('create-dialog').close();
      toast(t.created);
      loadSkills().then(function () { selectSkill(body.name); });
    }).catch(function (err) {
      toast(t.failed + ': ' + err.message);
    }).finally(function () {
      $('create-submit').disabled = false;
    });
  });

  loadMcp();
  loadSkills();
})();
</script>
</body>
</html>
